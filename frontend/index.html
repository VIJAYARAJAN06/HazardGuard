<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HAZARDGUARD — Intelligent Hazard-Zone Personnel Monitoring System</title>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-badge">INDUSTRIAL SAFETY CORE</div>
    <div class="brand-title">
      <span>🛡️</span> HAZARDGUARD
    </div>
    <div class="brand-sub">Intelligent Hazard-Zone<br>Personnel Monitoring System</div>
  </div>
  
  <nav id="nav"></nav>
  
  <div class="sidebar-footer">
    <div class="sys-health">
      <span class="pulse-dot"></span>
      <span id="sidebar-sys-status">SYSTEM OPERATIONAL</span>
    </div>
    <button onclick="confirmReset()" class="btn btn-outline btn-sm" style="width:100%;border-color:#7f1d1d;color:#fca5a5">
      🔄 Reset System State
    </button>
    <div style="font-size:10px;color:#64748b;margin-top:10px;text-align:center">
      v2.0.0 · Software Edition
    </div>
  </div>
</div>

<div class="modal-bg" id="reset-modal" style="display:none">
  <div class="modal">
    <div style="font-size:36px;margin-bottom:10px;text-align:center">⚠️</div>
    <h3 style="font-weight:800;font-size:16px;margin-bottom:8px;text-align:center">Reset Incident & Telemetry State?</h3>
    <p style="font-size:13px;color:#94a3b8;margin-bottom:20px;text-align:center;line-height:1.5">
      This will clear recorded incidents and return the deterministic scenario engine to initial baseline.
    </p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="doReset()" class="btn btn-danger">Yes, Reset System</button>
      <button onclick="document.getElementById('reset-modal').style.display='none'" class="btn btn-outline">Cancel</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="page-content"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
